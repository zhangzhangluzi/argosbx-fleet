- DOMAIN-SUFFIX,xiaohongshu.com,DIRECT
- RULE-SET,国内域名,DIRECT
- RULE-SET,国内IP,DIRECT,no-resolve
- NETWORK,UDP,UDP线路
- MATCH,日常线路
unified-delay: false
profile:
  store-selected: true
  store-fake-ip: true
rule-providers:
  国内域名:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    path: ./rules/ti-cn-domain.mrs
    interval: 86400
    proxy: 日常线路
    size-limit: 2097152
  国内IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
    path: ./rules/ti-cn-ip.mrs
    interval: 86400
    proxy: 日常线路
    size-limit: 1048576
  广告域名:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
    path: ./rules/ti-ads.mrs
    interval: 86400
    proxy: 日常线路
    size-limit: 1048576
