name: validate-and-release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -B -m unittest discover -s tests -v
      - run: python release.py dist
      - name: Blank server and native protocol acceptance
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml
          sudo python3 install.py dist/argosbx-fleet-*.tar.gz --sha256 "$(cut -d' ' -f1 dist/SHA256SUMS)"
          sudo python3 -B tests/native_install.py
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 release.py dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "ArgoSBX Fleet $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
