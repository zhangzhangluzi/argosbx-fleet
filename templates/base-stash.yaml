mode: rule
log-level: warning
dns:
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver-policy: {}
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost
  follow-rule: true
rule-providers:
  国内域名:
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    path: ./rules/ti-cn-domain.mrs
    interval: 86400
  国内IP:
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
    path: ./rules/ti-cn-ip.mrs
    interval: 86400
  广告域名:
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
    path: ./rules/ti-ads.mrs
    interval: 86400
rules:
- DOMAIN-SUFFIX,googleapis.cn,日常线路
- DOMAIN-SUFFIX,xn--ngstr-lra8j.com,日常线路
- DOMAIN,dns.alidns.com,DIRECT
- DOMAIN,doh.pub,DIRECT
- IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
- IP-CIDR,119.29.29.29/32,DIRECT,no-resolve
- IP-CIDR,1.1.1.1/32,日常线路,no-resolve
- IP-CIDR,8.8.8.8/32,日常线路,no-resolve
- DOMAIN-SUFFIX,telegram.org,Telegram
- DOMAIN-SUFFIX,t.me,Telegram
- DOMAIN-SUFFIX,telegram.me,Telegram
